services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    volumes:
      - ..:/workspace:cached
      - node_modules:/workspace/web/node_modules
      - pnpm-store:/root/.local/share/pnpm/store
      - go-mod:/root/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    command: sleep infinity
    environment:
      - NODE_ENV=development
      - APP_ENV=development
      - DATABASE_URL=postgres://postgres:pass@postgres:5432/fsledger?sslmode=disable
    stdin_open: true
    tty: true

  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=fsledger
    volumes:
      - pgdata:/var/lib/postgresql
      
volumes:
  node_modules:
  pnpm-store:
  go-mod:
  go-build-cache:
  pgdata:
