components:
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
      required:
        - message
      example:
        message: Bad Request
    Stocks:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            format: uuid
          name:
            type: string
            minLength: 1
          hasAmount:
            type: boolean
          currency:
            type: string
          currencyExponent:
            type: integer
            format: int32
        required:
          - id
          - name
          - hasAmount
          - currency
          - currencyExponent
      example:
        - id: cc57d6d9-fd04-4f91-9e5b-4e341780e4b7
          name: bank A
          hasAmount: true
          currency: $
          currencyExponent: 2
        - id: 0afeb903-d823-44a7-b4ef-0017e72bad5d
          name: my wallet
          hasAmount: true
          currency: $
          currencyExponent: 2
        - id: bde589b4-7550-45c4-a06d-dea931e24031
          name: out
          hasAmount: true
          currency: $
          currencyExponent: 2
    StockData:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        hasAmount:
          type: boolean
        currency:
          type: string
        currencyExponent:
          type: integer
          format: int32
        description:
          type: string
        tags:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
      required:
        - name
        - hasAmount
        - currency
        - currencyExponent
        - description
        - tags
      example:
        name: bank B
        hasAmount: true
        currency: $
        currencyExponent: 2
        description: my main bank
        tags:
          - 45021b9e-330c-4a1f-891c-4067fab27cb0
          - 3c01d765-c6ad-4423-a893-f59e265c30d3
          - 87b0cad1-6101-4863-96e9-51c2bf93973c
    StockID:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
        - id
      example:
        id: 873ccb0f-e7f4-4d22-9422-e8bbb38354a5
    TagID:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
        - id
      example:
        id: 45021b9e-330c-4a1f-891c-4067fab27cb0
    TagData:
      type: object
      properties:
        name:
          type: string
          minLength: 1
      required:
        - name
      example:
        name: banks
    Tags:
      type: array
      items:
        type: object
        allOf:
          - $ref: '#/components/schemas/TagID'
          - $ref: '#/components/schemas/TagData'
        required:
          - id
          - name
      example:
        - id: 45021b9e-330c-4a1f-891c-4067fab27cb0
          name: banks
        - id: 3c01d765-c6ad-4423-a893-f59e265c30d3
          name: daily use
        - id: 87b0cad1-6101-4863-96e9-51c2bf93973c
          name: savings
    FlowData:
      type: object
      properties:
        from:
          type: string
          format: uuid
        to:
          type: string
          format: uuid
        from_amount:
          type: string
          format: int64
        to_amount:
          type: string
          format: int64
        tags:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
      required:
        - from
        - to
        - from_amount
        - to_amount
        - tags
      example:
        from: 0afeb903-d823-44a7-b4ef-0017e72bad5d
        to: bde589b4-7550-45c4-a06d-dea931e24031
        from_amount: '5000'
        to_amount: '5000'
        tags:
          - 9462e790-5796-4791-af0d-399720973378
    TransactionData:
      type: object
      properties:
        description:
          type: string
        occurred_at:
          type: string
          format: date
        tags:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        flows:
          type: array
          items:
            $ref: '#/components/schemas/FlowData'
      required:
        - description
        - occurred_at
        - tags
        - flows
      example:
        description: Shopping at a nearby grocery store. Also I earn some points.
        occurred_at: '2026-08-07'
        tags:
          - ce15fc88-deda-4c78-9f4e-a1611152cb13
          - 8f4b9006-b89a-4533-9521-0854055fb9da
        flows:
          - from: 0afeb903-d823-44a7-b4ef-0017e72bad5d
            to: bde589b4-7550-45c4-a06d-dea931e24031
            from_amount: '5000'
            to_amount: '5000'
            tags:
              - 76b7f51a-5d85-4bf0-b032-0e9853e79f9e
          - from: bde589b4-7550-45c4-a06d-dea931e24031
