openapi: 3.1.0
info:
  title: FSLedger
  version: 0.0.1
  description: A highly customizable personal ledger based on the Flow & Stock model.
  contact:
    url: https://github.com/M-Haruki/fsledger
  license:
    name: GNU Affero General Public License v3.0
    url: https://github.com/M-Haruki/fsledger/blob/main/LICENSE
servers:
  - url: http://localhost:1323/api
    description: develop environment
tags:
  - name: stock
    description: stock
  - name: transaction
    description: transaction
  - name: flow
    description: flow
  - name: common
    description: common
paths:
  /health:
    get:
      operationId: healthCheck
      summary: Health Check
      description: A health check endpoint for docker.
      tags:
        - common
      security: []
      responses:
        '204':
          description: Healthy.
        '503':
          description: Unhealthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /stocks:
    get:
      operationId: listStocks
      summary: List
      description: Get all stocks' id and name.
      tags:
        - stock
      security: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stocks'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createStock
      summary: Create
      description: Create new stock then get created stock id.
      tags:
        - stock
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockData'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockID'
        '400':
          description: Bad Request
