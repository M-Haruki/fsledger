StocksView:
  post:
    operationId: stockView
    summary: Search stocks
    description: Search stocks and get finded data.
    tags:
      - view
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/view.yml#/components/schemas/ViewDSLForStockView"
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: "../components/schemas/view.yml#/components/schemas/StocksView"
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
      "500":
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
