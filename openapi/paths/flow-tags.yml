Tags_:
  get:
    operationId: listFlowTags
    summary: List
    description: Get all tags.
    tags:
      - flow
    security: []
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: "../components/schemas/tags.yml#/components/schemas/Tags"
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
      "500":
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
  post:
    operationId: createFlowTags
    summary: Create
    description: Create a new tag.
    tags:
      - flow
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/tags.yml#/components/schemas/TagData"
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: "../components/schemas/tags.yml#/components/schemas/TagID"
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
      "409":
        description: Conflict
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
      "500":
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
TagsID:
  get:
    operationId: getFlowTag
    summary: Get
    description: Get a tag.
    tags:
      - flow
    security: []
    parameters:
      - $ref: "../components/parameters/tags.yml#/components/parameters/TagIDParam"
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: "../components/schemas/tags.yml#/components/schemas/TagData"
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
      "500":
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
  put:
    operationId: updateFlowTag
    summary: Update
    description: Change a tag.
    tags:
      - flow
    security: []
    parameters:
      - $ref: "../components/parameters/tags.yml#/components/parameters/TagIDParam"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/tags.yml#/components/schemas/TagData"
    responses:
      "204":
        description: No Content
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
      "409":
        description: Conflict
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
      "500":
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
  delete:
    operationId: deleteFlowTag
    summary: Delete
    description: Delete a tag.
    tags:
      - flow
    security: []
    parameters:
      - $ref: "../components/parameters/tags.yml#/components/parameters/TagIDParam"
    responses:
      "204":
        description: No Content
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
      "500":
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
