Transactions:
  post:
    operationId: createTransaction
    summary: Create
    description: Create new transaction with flows.
    tags:
      - transaction
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/transaction.yml#/components/schemas/TransactionPostData"
    responses:
      "201":
        description: "Created."
        content:
          application/json:
            schema:
              $ref: "../components/schemas/transaction.yml#/components/schemas/TransactionID"
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
      "500":
        description: "Server Error"
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
TransactionsID:
  get:
    operationId: getTransaction
    summary: Get
    description: Get a transaction and its flows.
    tags:
      - transaction
    security: []
    parameters:
      - $ref: "../components/parameters/transaction.yml#/components/parameters/TransactionID"
    responses:
      "200":
        description: ""
        content:
          application/json:
            schema:
              $ref: "../components/schemas/transaction.yml#/components/schemas/TransactionGetData"
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
      "404":
        description: The transaction not found.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
      "500":
        description: "Server Error"
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
  put:
    operationId: updateTransaction
    summary: Update
    description: Change a transaction and its flows.
    tags:
      - transaction
    security: []
    parameters:
      - $ref: "../components/parameters/transaction.yml#/components/parameters/TransactionID"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/transaction.yml#/components/schemas/TransactionPostData"
    responses:
      "204":
        description: Changed.
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
      "404":
        description: The transaction not found.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
      "500":
        description: "Server Error"
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
  delete:
    operationId: deleteTransaction
    summary: Delete
    description: Delete a transaction and its flows.
    tags:
      - transaction
    security: []
    parameters:
      - $ref: "../components/parameters/transaction.yml#/components/parameters/TransactionID"
    responses:
      "204":
        description: Deleted.
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
      "404":
        description: The transaction not found.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
      "500":
        description: "Server Error"
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
