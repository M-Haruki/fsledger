Flows:
  post:
    operationId: createFlow
    summary: Create
    description: Create new flow.
    tags:
      - flow
    security: []
    parameters:
      - $ref: "../components/parameters/transaction.yml#/components/parameters/TransactionID"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/flows.yml#/components/schemas/FlowData"
    responses:
      "201":
        description: "Created."
        content:
          application/json:
            schema:
              $ref: "../components/schemas/flows.yml#/components/schemas/FlowID"
FlowsID:
  put:
    operationId: updateFlow
    summary: Update
    description: Change a flow.
    tags:
      - flow
    security: []
    parameters:
      - $ref: "../components/parameters/flow.yml#/components/parameters/FlowIDParam"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/flows.yml#/components/schemas/FlowData"
    responses:
      "204":
        description: Changed.
      "404":
        description: The flow not found.
  delete:
    operationId: deleteFlow
    summary: Delete
    description: Delete a flow.
    tags:
      - flow
    security: []
    parameters:
      - $ref: "../components/parameters/flow.yml#/components/parameters/FlowIDParam"
    responses:
      "204":
        description: "Deleted."
      "404":
        description: The flow not found.