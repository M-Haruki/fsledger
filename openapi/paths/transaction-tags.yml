Tags_:
  get:
    operationId: listTransactionTags
    summary: List
    description: Get all tags.
    tags:
      - transaction
    security: []
    responses:
      "200":
        description: ""
        content:
          application/json:
            schema:
              $ref: "../components/schemas/tags.yml#/components/schemas/Tags"
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
      "500":
        description: Server Error
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
  post:
    operationId: createTransactionTags
    summary: Create
    description: Create a new tag.
    tags:
      - transaction
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/tags.yml#/components/schemas/TagData"
    responses:
      "201":
        description: Created.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/tags.yml#/components/schemas/TagID"
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
      "500":
        description: Server Error
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
