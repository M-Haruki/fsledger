Tags_:
  get:
    operationId: listTags
    summary: List
    description: Get all tags.
    tags:
      - tag
    security: []
    parameters:
      - $ref: "../components/parameters/tags.yml#/components/parameters/TagType"
    responses:
      "200":
        description: ""
        content:
          application/json:
            schema:
              $ref: "../components/schemas/tags.yml#/components/schemas/Tags"
  post:
    operationId: createTags
    summary: Create
    description: Create a new tag.
    tags:
      - tag
    security: []
    parameters:
      - $ref: "../components/parameters/tags.yml#/components/parameters/TagType"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/tags.yml#/components/schemas/TagData"
    responses:
      "201":
        description: Created.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/tags.yml#/components/schemas/TagID"
TagsID:
  get:
    operationId: getTag
    summary: Get
    description: Get a tag.
    tags:
      - tag
    security: []
    parameters:
      - $ref: "../components/parameters/tags.yml#/components/parameters/TagType"
      - $ref: "../components/parameters/tags.yml#/components/parameters/TagIDParam"
    responses:
      "200":
        description: ""
        content:
          application/json:
            schema:
              $ref: "../components/schemas/tags.yml#/components/schemas/TagData"
      "404":
        description: The tag not found.
  put:
    operationId: updateTag
    summary: Update
    description: Change a tag.
    tags:
      - tag
    security: []
    parameters:
      - $ref: "../components/parameters/tags.yml#/components/parameters/TagType"
      - $ref: "../components/parameters/tags.yml#/components/parameters/TagIDParam"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/tags.yml#/components/schemas/TagData"
    responses:
      "204":
        description: "Changed."
      "404":
        description: The tag not found.
  delete:
    operationId: deleteTag
    summary: Delete
    description: Delete a tag.
    tags:
      - tag
    security: []
    parameters:
      - $ref: "../components/parameters/tags.yml#/components/parameters/TagType"
      - $ref: "../components/parameters/tags.yml#/components/parameters/TagIDParam"
    responses:
      "204":
        description: "Deleted."
      "404":
        description: The tag not found.
