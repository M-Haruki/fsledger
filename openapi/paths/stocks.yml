Stocks:
  get:
    operationId: listStocks
    summary: List
    description: Get all stocks' id and name.
    tags:
      - stock
    security: []
    responses:
      "200":
        description: ""
        content:
          application/json:
            schema:
              $ref: "../components/schemas/stocks.yml#/components/schemas/Stocks"
      "500":
        description: Server Error
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
  post:
    operationId: createStock
    summary: Create
    description: Create new stock then get created stock id.
    tags:
      - stock
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/stocks.yml#/components/schemas/StockData"
    responses:
      "201":
        description: Created.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/stocks.yml#/components/schemas/StockID"
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
      "500":
        description: "Server Error"
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
StocksID:
  get:
    operationId: getStock
    summary: Get
    description: Get stock details.
    tags:
      - stock
    security: []
    parameters:
      - $ref: "../components/parameters/stock.yml#/components/parameters/StockIDParam"
    responses:
      "200":
        description: ""
        content:
          application/json:
            schema:
              $ref: "../components/schemas/stocks.yml#/components/schemas/StockGetData"
      "404":
        description: The stock not found.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
      "500":
        description: "Server Error"
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
  put:
    operationId: updateStock
    summary: Update
    description: Change a stock.
    tags:
      - stock
    security: []
    parameters:
      - $ref: "../components/parameters/stock.yml#/components/parameters/StockIDParam"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/stocks.yml#/components/schemas/StockData"
    responses:
      "204":
        description: Changed.
      "404":
        description: The stock not found.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
      "500":
        description: "Server Error"
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
  delete:
    operationId: deleteStock
    summary: Delete
    description: Delete a stock.
    tags:
      - stock
    security: []
    parameters:
      - $ref: "../components/parameters/stock.yml#/components/parameters/StockIDParam"
    responses:
      "204":
        description: Changed.
      "404":
        description: The stock not found.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
      "500":
        description: "Server Error"
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/components/schemas/Error"
