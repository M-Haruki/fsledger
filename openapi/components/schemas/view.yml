components:
  schemas:
    StocksView:
      type: array
      items:
        type: object
        allOf:
          - type: object
            properties:
              id:
                type: string
                format: uuid
              total:
                type: integer
                format: int64
            required:
              - id
              - total
            example:
              id: cc57d6d9-fd04-4f91-9e5b-4e341780e4b7
              total: 5678
          - $ref: "./stocks.yml#/components/schemas/StockData"
    TransactionsView:
      type: array
      items:
        type: object
        allOf:
          - type: object
            properties:
              id:
                type: string
                format: uuid
            required:
              - id
            example:
              id: 6d313569-d48f-45a4-9cfb-978c880ed460
          - $ref: "./transactions.yml#/components/schemas/TransactionData"
    FlowsView:
      type: array
      items:
        type: object
        allOf:
          - type: object
            properties:
              id:
                type: string
                format: uuid
            required:
              - id
            example:
              id: 0afeb903-d823-44a7-b4ef-0017e72bad5d
          - $ref: "./flows.yml#/components/schemas/FlowData"

    # DSL & Rule & Logic
    ## Stock View
    ViewDSLForStockView:
      type: object
      properties:
        base-date:
          type: string
        rule:
          $ref: "#/components/schemas/ViewDSLRuleForStockView"
      example:
        base-date: 2026-01-01
        rule:
          AND:
            - target: stocks
              tags:
                - aaaa0000-0000-0000-0000-000000000001
                - bbbb0000-0000-0000-0000-000000000002
            - NOT:
                target: stocks
                id:
                  - cccc0000-0000-0000-0000-000000000003

    ViewDSLRuleForStockView:
      oneOf:
        - $ref: "#/components/schemas/ViewDSLLogicForStockView"
        - $ref: "#/components/schemas/ViewDSLStockCondition"

    ViewDSLLogicForStockView:
      oneOf:
        - type: object
          properties:
            AND:
              type: array
              items:
                $ref: "#/components/schemas/ViewDSLRuleForStockView"
          minItems: 1
          required:
            - AND
          additionalProperties: false
        - type: object
          properties:
            OR:
              type: array
              items:
                $ref: "#/components/schemas/ViewDSLRuleForStockView"
          minItems: 1
          required:
            - OR
          additionalProperties: false
        - type: object
          properties:
            NOT:
              $ref: "#/components/schemas/ViewDSLRuleForStockView"
          required:
            - NOT
          additionalProperties: false

    ## Transaction View
    ViewDSLForTransactionView:
      type: object
      properties:
        base-date:
          type: string
        rule:
          $ref: "#/components/schemas/ViewDSLRuleForTransactionView"
      example:
        base-date: 2026-01-01
        rule:
          AND:
            - target: transactions
              tags:
                - ffff0000-0000-0000-0000-000000000006
                - aaaa1111-0000-0000-0000-000000000007
            - target: transactions
              mode: absolute
              relation: after-or-equal
              unit: year-month
              date: 2026-01

    ViewDSLRuleForTransactionView:
      oneOf:
        - $ref: "#/components/schemas/ViewDSLLogicForTransactionView"
        - $ref: "#/components/schemas/ViewDSLTransactionCondition"

    ViewDSLLogicForTransactionView:
      oneOf:
        - type: object
          properties:
            AND:
              type: array
              items:
                $ref: "#/components/schemas/ViewDSLRuleForTransactionView"
          minItems: 1
          required:
            - AND
          additionalProperties: false
        - type: object
          properties:
            OR:
              type: array
              items:
                $ref: "#/components/schemas/ViewDSLRuleForTransactionView"
          minItems: 1
          required:
            - OR
          additionalProperties: false
        - type: object
          properties:
            NOT:
              $ref: "#/components/schemas/ViewDSLRuleForTransactionView"
          required:
            - NOT
          additionalProperties: false

    ## Flow View
    ViewDSLForFlowView:
      type: object
      properties:
        base-date:
          type: string
        rule:
          $ref: "#/components/schemas/ViewDSLRuleForFlowView"
      example:
        base-date: 2026-01-01
        rule:
          AND:
            - target: stocks-from
              tags:
                - dddd0000-0000-0000-0000-000000000004
            - target: stocks-to
              tags:
                - eeee0000-0000-0000-0000-000000000005
            - target: transactions
              tags:
                - ffff0000-0000-0000-0000-000000000006
            - target: flows
              amount-min: 1000
              amount-max: 5000

    ViewDSLRuleForFlowView:
      oneOf:
        - $ref: "#/components/schemas/ViewDSLLogicForFlowView"
        - $ref: "#/components/schemas/ViewDSLStockConditionForFlowView"
        - $ref: "#/components/schemas/ViewDSLTransactionCondition"
        - $ref: "#/components/schemas/ViewDSLFlowCondition"

    ViewDSLLogicForFlowView:
      oneOf:
        - type: object
          properties:
            AND:
              type: array
              items:
                $ref: "#/components/schemas/ViewDSLRuleForFlowView"
          minItems: 1
          required:
            - AND
          additionalProperties: false
        - type: object
          properties:
            OR:
              type: array
              items:
                $ref: "#/components/schemas/ViewDSLRuleForFlowView"
          minItems: 1
          required:
            - OR
          additionalProperties: false
        - type: object
          properties:
            NOT:
              $ref: "#/components/schemas/ViewDSLRuleForFlowView"
          required:
            - NOT
          additionalProperties: false

    # Conditions
    ViewDSLStockCondition:
      oneOf:
        - type: object
          properties:
            target:
              const: stocks
            id:
              type: array
              items:
                type: string
                format: uuid
          required:
            - target
            - id
          additionalProperties: false
        - type: object
          properties:
            target:
              const: stocks
            tags:
              type: array
              items:
                type: string
                format: uuid
          required:
            - target
            - tags
          additionalProperties: false

    ViewDSLStockConditionForFlowView:
      oneOf:
        - type: object
          properties:
            target:
              enum:
                - stocks-from
                - stocks-to
            id:
              type: array
              items:
                type: string
                format: uuid
          required:
            - target
            - id
          additionalProperties: false
        - type: object
          properties:
            target:
              enum:
                - stocks-from
                - stocks-to
            tags:
              type: array
              items:
                type: string
                format: uuid
          required:
            - target
            - tags
          additionalProperties: false

    ViewDSLTransactionCondition:
      oneOf:
        - type: object
          properties:
            target:
              const: transactions
            tags:
              type: array
              items:
                type: string
                format: uuid
          required:
            - target
            - tags
          additionalProperties: false
        - type: object
          properties:
            target:
              const: transactions
            mode:
              const: absolute
            relation:
              enum:
                - before
                - before-or-equal
                - point
                - after-or-equal
                - after
            unit:
              enum:
                - day
                - month
                - year
            num:
              type: integer
              format: int32
          required:
            - target
            - mode
            - relation
            - unit
            - num
          additionalProperties: false
        - type: object
          properties:
            target:
              const: transactions
            mode:
              const: absolute
            relation:
              enum:
                - before
                - before-or-equal
                - point
                - after-or-equal
                - after
            unit:
              enum:
                - year-month
                - year-month-day
            date:
              type: string
          required:
            - target
            - mode
            - relation
            - unit
            - date
          additionalProperties: false
        - type: object
          properties:
            target:
              const: transactions
            mode:
              const: relative
            relation:
              enum:
                - before
                - before-or-equal
                - point
                - after-or-equal
                - after
            unit:
              enum:
                - day
                - month
                - year
            num:
              type: integer
              format: int32
          required:
            - target
            - mode
            - relation
            - unit
            - num
          additionalProperties: false

    ViewDSLFlowCondition:
      oneOf:
        - type: object
          properties:
            target:
              const: flows
            tags:
              type: array
              items:
                type: string
                format: uuid
          required:
            - target
            - tags
          additionalProperties: false
        - type: object
          properties:
            target:
              const: flows
            amount-min:
              type: integer
              format: int64
            amount-max:
              type: integer
              format: int64
          required:
            - target
          anyOf:
            - required:
                - amount-max
            - required:
                - amount-min
          additionalProperties: false
