components:
  schemas:
    FlowID:
      type: object
      properties: 
        id:
          type: string
          format: uuid
      required:
        - id
    FlowPostData:
      type: object
      properties: 
        from:
          type: string
          format: uuid
        to:
          type: string
          format: uuid
        amount:
          type: number
      required:
        - from
        - to
        - amount
      example:
        from: 0afeb903-d823-44a7-b4ef-0017e72bad5d
        to: bde589b4-7550-45c4-a06d-dea931e24031
        amount: 50
    FlowGetData:
      type: object
      properties: 
        from:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
          required:
            - id
            - name
        to:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
          required:
            - id
            - name
        amount:
          type: number
      required:
        - from
        - to
        - amount
      example:
        from:
          id: 0afeb903-d823-44a7-b4ef-0017e72bad5d
          name: my wallet
        to:
          id: bde589b4-7550-45c4-a06d-dea931e24031
          name: out
        amount: 50