components:
  schemas:
    FlowID:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
        - id
    FlowData:
      type: object
      properties:
        from:
          type: string
          format: uuid
        to:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
        tags:
          type: array
          items:
            type: string
            format: uuid
      required:
        - from
        - to
        - amount
        - tags
      example:
        from: 0afeb903-d823-44a7-b4ef-0017e72bad5d
        to: bde589b4-7550-45c4-a06d-dea931e24031
        amount: 5000
        tags:
          - 9462e790-5796-4791-af0d-399720973378
