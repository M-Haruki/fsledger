components:
  schemas:
    FlowID:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
        - id
    FlowData:
      type: object
      properties:
        from:
          type: string
          format: uuid
        to:
          type: string
          format: uuid
        amount:
          type: number
        tags:
          type: array
          items:
            type: string
            format: uuid
      required:
        - from
        - to
        - amount
        - tags
      example:
        from: 0afeb903-d823-44a7-b4ef-0017e72bad5d
        to: bde589b4-7550-45c4-a06d-dea931e24031
        amount: 50
        tags:
          - 9462e790-5796-4791-af0d-399720973378
    FlowGetData:
      properties:
        from:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
          required:
            - id
            - name
        to:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
          required:
            - id
            - name
        amount:
          type: number
        tags:
          $ref: "./tags.yml#/components/schemas/Tags"
      required:
        - from
        - to
        - amount
        - tags
      example:
        from:
          id: 0afeb903-d823-44a7-b4ef-0017e72bad5d
          name: my wallet
        to:
          id: bde589b4-7550-45c4-a06d-dea931e24031
          name: out
        amount: 50
        tags:
          - id: 76b7f51a-5d85-4bf0-b032-0e9853e79f9e
            name: consume
