components:
  schemas:
    TransactionID:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
        - id
      example:
        id: 6d313569-d48f-45a4-9cfb-978c880ed460
    TransactionData:
      type: object
      properties:
        desc:
          type: string
        occurred_at:
          type: string
          format: date
        tags:
          type: array
          items:
            type: string
            format: uuid
        flows:
          type: array
          items:
            $ref: "./flows.yml#/components/schemas/FlowData"
      required:
        - desc
        - occurred_at
        - tags
        - flows
      example:
        desc: Shopping at a nearby grocery store. Also I earn some points.
        occurred_at: "2026-08-07"
        tags:
          - ce15fc88-deda-4c78-9f4e-a1611152cb13
          - 8f4b9006-b89a-4533-9521-0854055fb9da
        flows:
          - from: 0afeb903-d823-44a7-b4ef-0017e72bad5d
            to: bde589b4-7550-45c4-a06d-dea931e24031
            amount: 5000
            tags:
              - 76b7f51a-5d85-4bf0-b032-0e9853e79f9e
          - from: bde589b4-7550-45c4-a06d-dea931e24031
            to: cc57d6d9-fd04-4f91-9e5b-4e341780e4b7
            amount: 25
            tags:
              - 9462e790-5796-4791-af0d-399720973378
